[project]
name = "orion-the-warrior"
version = "0.1.0"
description = "Orion the Warrior local orchestration app"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pillow>=10.4.0",
  "torch>=2.8.0",
  "diffusers>=0.35.0",
  "transformers>=4.55.0",
  "accelerate>=1.10.0",
  "safetensors>=0.6.0",
  "huggingface-hub>=0.34.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "httpx2"
]

[tool.pytest.ini_options]
pythonpath = ["."]
