<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORION — AI Control Center</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <a href="/" class="brand">
        <span class="dot"></span>
        ORION
      </a>
      <div class="system-badge">
        <span class="status-light" id="status-light"></span>
        <span id="status">online</span>
        <span class="muted-text" id="uptime">—</span>
      </div>
    </header>

    <div class="grid">
      <div class="card">
        <div class="label">CPU <span id="cpu-badge" style="opacity:0.7">LOAD</span></div>
        <div class="big" id="cpu">--%</div>
        <div class="sub">Processor utilization</div>
        <div class="meter"><div class="meter-fill" id="cpu-fill"></div></div>
      </div>

      <div class="card">
        <div class="label">RAM</div>
        <div class="big" id="ram">--%</div>
        <div class="sub">Memory utilization</div>
        <div class="meter"><div class="meter-fill" id="ram-fill"></div></div>
      </div>

      <div class="card">
        <div class="label">DISK</div>
        <div class="big" id="disk">--%</div>
        <div class="sub">Storage utilization</div>
        <div class="meter"><div class="meter-fill" id="disk-fill"></div></div>
      </div>

      <div class="card status-card">
        <div class="label">BOT STATUS</div>
        <div class="big" id="bot-status" style="font-size:1.6rem">ONLINE</div>
        <div class="sub">ORION control center</div>
        <div class="pill">
          <span class="status-light"></span>
          <span>API reachable</span>
        </div>
      </div>
    </div>

    <div class="logs-section">
      <div class="logs-header">
        <div class="label">SYSTEM LOGS</div>
        <div class="muted-text">auto-updating</div>
      </div>
      <div class="logs-list" id="logs"></div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
